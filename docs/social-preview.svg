<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141d33"/>
    </linearGradient>
    <linearGradient id="saccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ed321"/>
      <stop offset="1" stop-color="#b8e986"/>
    </linearGradient>
    <pattern id="sgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#24304f"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#sbg)"/>
  <rect width="1280" height="640" fill="url(#sgrid)" opacity="0.55"/>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="80" y="92" font-family="Menlo, Consolas, monospace" font-size="22" fill="#8b95a9">vidanov / <tspan fill="#c7d0e0">shape</tspan></text>

    <text x="78" y="196" font-size="58" font-weight="800" fill="#f2f5fa">Prompts are suggestions.</text>
    <text x="78" y="268" font-size="58" font-weight="800" fill="url(#saccent)">Shape is enforcement.</text>

    <text x="80" y="326" font-size="25" fill="#c7d0e0">Phases, transactions, budget gates and proof traces for AI agents.</text>

    <rect x="80" y="366" width="480" height="62" rx="12" fill="#0d1117" stroke="#2f3f63" stroke-width="1.5"/>
    <text x="108" y="405" font-family="Menlo, Consolas, monospace" font-size="24" fill="#7ee787">$ <tspan fill="#e6edf3">cp shape.py your_project/</tspan></text>

    <g font-size="19" font-weight="600">
      <rect x="80" y="466" width="150" height="44" rx="22" fill="#182238" stroke="#2a3a5e"/>
      <text x="155" y="494" text-anchor="middle" fill="#c7d0e0">zero deps &#10003;</text>
      <rect x="246" y="466" width="140" height="44" rx="22" fill="#182238" stroke="#2a3a5e"/>
      <text x="316" y="494" text-anchor="middle" fill="#c7d0e0">one file &#10003;</text>
      <rect x="402" y="466" width="140" height="44" rx="22" fill="#182238" stroke="#2a3a5e"/>
      <text x="472" y="494" text-anchor="middle" fill="#c7d0e0">62 tests &#10003;</text>
    </g>

    <text x="80" y="576" font-size="20" fill="#8b95a9">EXPLORE &#8594; DECIDE &#8594; COMMIT &#183; readable rule DSL &#183; MIT</text>

    <!-- right: the gate motif -->
    <rect x="960" y="140" width="240" height="240" rx="28" fill="#101a30" stroke="#7ed321" stroke-width="2.5"/>
    <circle cx="1034" cy="196" r="14" fill="#4a90e2"/>
    <text x="1062" y="204" font-family="Menlo, Consolas, monospace" font-size="20" fill="#8b95a9">explore</text>
    <circle cx="1034" cy="252" r="14" fill="#f5a623"/>
    <text x="1062" y="260" font-family="Menlo, Consolas, monospace" font-size="20" fill="#8b95a9">decide</text>
    <circle cx="1034" cy="308" r="14" fill="#7ed321"/>
    <text x="1062" y="316" font-family="Menlo, Consolas, monospace" font-size="20" fill="#8b95a9">commit</text>
    <text x="1080" y="356" text-anchor="middle" font-size="19" font-weight="700" fill="#b8e986">the gate</text>
  </g>
</svg>
